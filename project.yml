# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen
name: Wispen

options:
  deploymentTarget:
    iOS: "18.0"
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Wispen.xcconfig
  Release: Config/Wispen.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Apple Intelligence (FoundationModels) is only used when available (iOS 26 / macOS 26),
    # so link it weakly and the app still launches on older systems.
    OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]

packages:
  WispenCore:
    path: Packages/WispenCore
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: "0.18.0"

targets:
  # ───────────────────────── iPhone app ─────────────────────────
  Wispen:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Apps/Shared
      - path: Apps/LiveActivity
    dependencies:
      - package: WispenCore
      - package: WhisperKit
      - package: WhisperKit
        product: SpeakerKit
      - target: WispenKeyboard
      - target: WispenWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WISPEN_BUNDLE_PREFIX).wispen
        PRODUCT_NAME: Wispen
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Config/Generated/Wispen.entitlements
      properties:
        com.apple.security.application-groups:
          - $(WISPEN_APP_GROUP)
    info:
      path: Config/Generated/Wispen-Info.plist
      properties:
        CFBundleDisplayName: Wispen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WispenAppGroup: $(WISPEN_APP_GROUP)
        NSMicrophoneUsageDescription: Wispen listens only while you dictate or record a meeting. Speech is transcribed on your iPhone and never leaves it.
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLName: app.wispen.flow
            CFBundleURLSchemes: [wispen]
        ITSAppUsesNonExemptEncryption: false

  # ───────────────────────── iPhone keyboard ─────────────────────────
  WispenKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Keyboard
    dependencies:
      - package: WispenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WISPEN_BUNDLE_PREFIX).wispen.keyboard
        PRODUCT_NAME: WispenKeyboard
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: Config/Generated/WispenKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(WISPEN_APP_GROUP)
    info:
      path: Config/Generated/WispenKeyboard-Info.plist
      properties:
        CFBundleDisplayName: Wispen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WispenAppGroup: $(WISPEN_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            # Full Access lets the keyboard talk to the Wispen app (shared App Group).
            RequestsOpenAccess: true
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US

  # ───────────────── Dynamic Island / Lock Screen (Live Activity) ─────────────────
  WispenWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/Widgets
      - path: Apps/LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WISPEN_BUNDLE_PREFIX).wispen.widgets
        PRODUCT_NAME: WispenWidgets
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/Generated/WispenWidgets-Info.plist
      properties:
        CFBundleDisplayName: Wispen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ───────────────────────── Mac menu-bar app ─────────────────────────
  WispenMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS
      - path: Apps/Shared
    dependencies:
      - package: WispenCore
      - package: WhisperKit
      - package: WhisperKit
        product: SpeakerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WISPEN_BUNDLE_PREFIX).wispen.mac
        PRODUCT_NAME: Wispen
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Typing into other apps (Accessibility + synthetic ⌘V) isn't possible from the sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    entitlements:
      path: Config/Generated/WispenMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    info:
      path: Config/Generated/WispenMac-Info.plist
      properties:
        CFBundleDisplayName: Wispen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Wispen listens only while you hold the fn key or record a meeting. Speech is transcribed on your Mac and never leaves it.
        NSScreenCaptureUsageDescription: Wispen captures system audio (not your screen) to transcribe the other people in a meeting.

schemes:
  Wispen:
    build:
      targets:
        Wispen: all
        WispenKeyboard: all
        WispenWidgets: all
    run:
      config: Debug
  WispenMac:
    build:
      targets:
        WispenMac: all
    run:
      config: Debug
